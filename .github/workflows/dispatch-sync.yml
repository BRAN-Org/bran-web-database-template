name: Dispatch Downstream Template Sync

on:
  push:
    branches: [ main, master ]

jobs:
  notify-downstream-repos:
    name: Notify Downstream Repositories of Template Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Template Repository
        uses: actions/checkout@v4.2.2

      - name: Broadcast Sync Trigger to BRAN Org Repos
        env:
          GH_TOKEN: ${{ secrets.ORGANIZATION_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${{ secrets.ORGANIZATION_SYNC_TOKEN }}" ]; then
            echo "::warning::ORGANIZATION_SYNC_TOKEN não está configurado. O GITHUB_TOKEN padrão não tem escopo cross-repo para disparar repository_dispatch. Configure ORGANIZATION_SYNC_TOKEN nas secrets da Org para ativação imediata (o cron semanal continuará sincronizando normalmente)."
          fi
          echo "Notificando repositórios derivados da BRAN Org sobre o merge na main..."
          REPOS=("BRAN-Org/ebbc-open-database" "BRAN-Org/abec-open-database" "BRAN-Org/datagramazero-open-database" "BRAN-Org/enancib-open-database")
          
          for REPO in "${REPOS[@]}"; do
            echo "Enviando sinal de atualizacao para: $REPO"
            if ! gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/$REPO/dispatches \
              -f event_type='template_updated'; then
              echo "::warning::Não foi possível disparar dispatch para $REPO. O cron semanal cobrirá a sincronização."
            fi
          done
